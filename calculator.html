<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="calculator.css">

    
</head>
<body>
    <div class="calci1 ">
    <div class="calci2  ">
        
    <table >
        <tr class="tr1 ">
            <th class="trh1" id="display" >
               
            </th>
        </tr>
        
        <tr class="tr2 d-flex justify-content-end ">
            <th class="trh2" id="equal">
                0
            </th>
        </tr>

    </table>
    </div>

     <div class="buttondiv">
        <table>
            <tr>
                <th><button onclick="myFunctionAc()" style="color:orange;background-color: red;">AC</button></th>
                <th><button onclick="myFunctionDel()" style="color:orange;background-color: red;">DEL</button></th>
                <th><button onclick="myFunction('/')">/</button></th>
                <th><button onclick="myFunction('*')">x</button></th>
            </tr>

            <tr>
                <th><button onclick="myFunction('7')">7</button></th>
                <th><button onclick="myFunction('8')">8</button></th>
                <th><button onclick="myFunction('9')">9</button></th>
                <th><button onclick="myFunction('-')">-</button></th>
            </tr>
            

            <tr>
                <th><button onclick="myFunction('4')">4</button></th>
                <th><button onclick="myFunction('5')">5</button></th>
                <th><button onclick="myFunction('6')">6</button></th>
                <th><button onclick="myFunction('+')">+</button></th>
            </tr>

            <tr>
                <th><button onclick="myFunction('1')">1</button></th>
                <th><button onclick="myFunction('2')">2</button></th>
                <th><button onclick="myFunction('3')">3</button></th>
            </tr>
            
            <tr>
                <th><button onclick="myFunction('0')">0</button></th>
                <th><button onclick="myFunction('.')">.</button></th>
                <th><button onclick="myFunctionEqual('=')">=</button></th>

                <!-- <th ><button onclick="myFunction('%')">%</button></th> -->
            </tr>

        </table>
    </div>
    </div>
    
    <script>
        let display=document.getElementById("equal");
        let display1=document.getElementById("display"); //Outside any function
                                                         // At top level inside <script>

                                      // So they are global variables (global scope inside this script).

        // Add numbers/operators to display
  function myFunction(value) {
    let text = display.innerText;

    if (text === "0") {
      display.innerText = value;
    } else {
      display.innerText += value;
    }
  }

  // Clear all
  function myFunctionAc() {
    display.innerText = "0";
    display1.innerText = "";

  }

  // Delete last character
  function myFunctionDel() {
    let text = display1.innerText;

    if (text.length === 1) {
      display1.innerText = "";
    } else {
      display1.innerText = text.slice(0, -1);
    }
  }

  // Main calculation
  function myFunctionEqual() {
    
      let expr = display.innerText;

      let tokens = tokenize(expr);
      let result = evaluateTokens(tokens);
      display1.innerText=expr;
      display.innerText = result;
    
  }

  // Convert string into tokens
 
   function tokenize(expr) {   // // Example: "12+3*4" :- [12, "+", 3, "*", 4]
    let tokens = [];
    let num = "";   //This takes as string and 'string' + 'string'--> It concates

    for (let ch of expr) {
      if ("0123456789".includes(ch)) {
        num += ch;
      } else if ("+-*/".includes(ch)) {
        tokens.push(parseFloat(num));
        tokens.push(ch);
        num = "";
      }
    }

    tokens.push(parseFloat(num));
    return tokens;
    // This sends the finished tokens array back to the 
    // where tokenize() was called.
  }

  // Evaluate tokens
  function evaluateTokens(tokens) {    //This calculates result using BODMAS rule.
    // First pass: * and /
    let stack = [tokens[0]];    //stack=[12,"+",3,"*",4]

    for (let i = 1; i < tokens.length; i += 2) {
      let op = tokens[i];
      let nextNum = tokens[i + 1];

      if (op === "*") {
        stack[stack.length - 1] *= nextNum;
      } else if (op === "/") {
        if (nextNum === 0) return "Error";
        stack[stack.length - 1] /= nextNum;
      } else {
        stack.push(op);
        stack.push(nextNum);
      }
    }

    // Second pass: + and -
    let result = stack[0];

    for (let i = 1; i < stack.length; i += 2) {
      let op = stack[i];
      let nextNum = stack[i + 1];

      if (op === "+") result += nextNum;
      else if (op === "-") result -= nextNum;
    }

    return result;
  }
    </script>


<script src="demo.js"></script>

</body>
</html>
